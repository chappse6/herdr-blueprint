id = "seeun.blueprint"
name = "Blueprint"
version = "0.4.0"
min_herdr_version = "0.9.3"
description = "Shows the latest doc or diagram your agent sends in the side pane, drawn on request."
platforms = ["macos", "linux", "windows"]

# Needs uv: https://docs.astral.sh/uv/
[[build]]
command = ["uv", "sync", "--frozen", "--no-dev"]

[[panes]]
id = "viewer"
title = "Blueprint"
placement = "split"
command = ["uv", "run", "--no-sync", "herdr-blueprint"]

[[actions]]
id = "open"
title = "Open Blueprint"
contexts = ["workspace"]
command = ["uv", "run", "--no-sync", "herdr-blueprint", "open"]

[[actions]]
id = "install-skill"
title = "Add the Blueprint skill to Claude Code / Codex"
contexts = ["workspace"]
command = ["uv", "run", "--no-sync", "herdr-blueprint", "install-skill"]
