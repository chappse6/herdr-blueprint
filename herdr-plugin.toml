id = "seeun.blueprint"
name = "Blueprint"
version = "0.6.1"
min_herdr_version = "0.9.3"
description = "Your coding agent explains its work as diagrams, right next to the chat."
platforms = ["macos", "linux", "windows"]

# Needs uv: https://docs.astral.sh/uv/
# herdr builds in a temporary folder and then moves the plugin, so nothing may
# point back at the build folder: install a copy (--no-editable) and run the
# module instead of the console script, whose first line names the old python.
[[build]]
command = ["uv", "sync", "--frozen", "--no-dev", "--no-editable"]

# Installing (or updating) the plugin installs the agent skill and the short
# command too. A copy, not a link: this folder is about to move.
[[build]]
command = ["uv", "run", "--no-sync", "python", "-m", "herdr_blueprint", "install-skill", "--copy"]

[[panes]]
id = "viewer"
title = "Blueprint"
placement = "split"
command = ["uv", "run", "--no-sync", "python", "-m", "herdr_blueprint"]

# Runs the editor for `e` in a pane below the viewer, so the preview stays in sight.
[[panes]]
id = "editor"
title = "Edit"
placement = "split"
command = ["uv", "run", "--no-sync", "python", "-m", "herdr_blueprint", "edit-session"]

[[actions]]
id = "open"
title = "Open Blueprint"
contexts = ["workspace"]
command = ["uv", "run", "--no-sync", "python", "-m", "herdr_blueprint", "open"]

[[actions]]
id = "install-skill"
title = "Add the Blueprint skill to Claude Code / Codex"
contexts = ["workspace"]
command = ["uv", "run", "--no-sync", "python", "-m", "herdr_blueprint", "install-skill"]
