[project]
name = "herdr-blueprint"
version = "0.1.0"
description = "A live Markdown and Mermaid viewer for the herdr side pane."
readme = "README.md"
license = "MIT"
authors = [{ name = "Seeun Park" }]
requires-python = ">=3.10"
dependencies = [
    "textual>=1.0",
    "termaid[rich]>=0.9,<0.10",
    "watchfiles>=0.24",
    "platformdirs>=4.0",
]

[project.scripts]
herdr-blueprint = "herdr_blueprint.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-textual-snapshot>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_blueprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
# Use uv's own Python builds only. Never probe system interpreters such as
# macOS /usr/bin/python3, which pops up a "developer tools" install dialog.
python-preference = "only-managed"
