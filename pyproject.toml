[project]
name = "herdr-blueprint"
version = "0.5.0"
description = "Your coding agent explains its work as diagrams in a herdr side pane."
readme = "README.md"
license = "MIT"
authors = [{ name = "Seeun Park" }]
requires-python = ">=3.10"
dependencies = [
    "textual>=1.0",
    "termaid[rich]>=0.9,<0.10",
    "watchfiles>=0.24",
    "platformdirs>=4.0",
]

[project.scripts]
herdr-blueprint = "herdr_blueprint.cli:main"

[dependency-groups]
dev = [
    "pyte>=0.8.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-textual-snapshot>=1.0",
    "pytest-timeout>=2.3",
    "resvg-py>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_blueprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A stuck test fails with its traceback instead of hanging the run (and CI). On
# Windows pytest-timeout ends the whole run instead, after printing every stack.
timeout = 60

[tool.uv]
# Use uv's own Python builds only. Never probe system interpreters such as
# macOS /usr/bin/python3, which pops up a "developer tools" install dialog.
python-preference = "only-managed"
